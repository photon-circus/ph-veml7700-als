name: Feature proposal
description: Propose one bounded capability and its observable acceptance test.
title: "[Proposal]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe one concrete capability. This form is an intake record, not a
        decision log and not authorization to implement, publish, or release.
        Device evidence is identified only through stable `S-nn` propositions
        in the shared registry; do not copy their prose here.

  - type: textarea
    id: problem-value
    attributes:
      label: Problem and user value
      description: What concrete problem exists, for whom, and what would become possible?
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Observable behavior and boundary
      description: >
        State the public behavior, failures, and the lowest layer that can own
        it. Include timing, cancellation, or restoration only when relevant.
    validations:
      required: true

  - type: input
    id: shared-evidence
    attributes:
      label: Shared evidence propositions
      description: >
        Applicable stable `S-nn` IDs; `missing proposition` when no exact atomic
        row exists; or `no new device behavior` for a pure software capability.
        Do not quote or paraphrase a registry row or vendor passage.
      placeholder: "S-nn, missing proposition, or no new device behavior"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: >
        Name the observable test at the appropriate layer. Keep scripted
        transport, model behavior, conformance, and physical evidence distinct.
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: Only the adjacent boundary needed to keep this proposal finite.
