name: Bug or evidence discrepancy
description: Report a component mismatch or evidence that may change a shared proposition.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        For suspected device behavior, cite the applicable stable `S-nn` from
        [`docs/HARDWARE_CONTRACT.md`](https://github.com/photon-circus/ph-veml7700-als/blob/main/docs/HARDWARE_CONTRACT.md)
        without copying its proposition. Use `missing proposition` only when no
        exact referent exists, or `no device proposition` for a pure software or
        API defect. Report vulnerabilities through `SECURITY.md` instead.

  - type: dropdown
    id: evidence-source
    attributes:
      label: Observation source
      options:
        - Physical hardware
        - Pinned documentary source
        - Behavioral model or simulation
        - Scripted transport or mock
        - Code reading only
    validations:
      required: true

  - type: input
    id: shared-proposition
    attributes:
      label: Stable proposition
      description: Existing `S-nn`, `missing proposition`, or `no device proposition`.
      placeholder: "S-nn, missing proposition, or no device proposition"
    validations:
      required: true

  - type: textarea
    id: expected-observed
    attributes:
      label: Expected and observed behavior
      description: State the component-level mismatch without restating registry prose.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction or evidence procedure
      description: The smallest sequence or source review that produces the observation.
      render: text
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Relevant context and raw artifacts
      description: >
        Include commit/version and target when relevant. For physical evidence,
        include unit or lot, revision, reset history, voltage, temperature,
        procedure/tool commit, and a durable raw-artifact link or digest.
      render: text
