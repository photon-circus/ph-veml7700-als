# TEMPLATE: enable only after the source/reference adapters and fixture evidence
# schema are frozen.
schema = 1

[plan]
name = "veml7700-calibrated-optical-level5"
description = "Paired VEML7700 and calibrated-reference optical matrix"

[plan.requires]
roles = ["dut", "logic", "source", "lux_reference"]
dut_caps = ["sys.reset@1", "veml7700.fixture@1", "veml7700.optical@1"]

[plan.requires.metadata]
"veml7700.circuit_checks_passed" = true
"veml7700.light_source_repeatable" = true
"veml7700.optical_fixture_characterized" = true
"veml7700.reference_calibrated" = true

# Required matrix after implementation:
# - dark baseline and near-dark behavior;
# - multiple stable levels spanning indoor through bright conditions;
# - representative gain/integration pairs without saturation;
# - source classes including white LED and at least one broader-spectrum source;
# - paired timestamped reference lux, ALS counts, white counts, nominal micro-lux,
#   temperature, VDD, fixture revision, and geometry;
# - saturation, recovery, repeatability, hysteresis, and warm-up checks.
