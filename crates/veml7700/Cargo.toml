[package]
name = "ph-veml7700-als"
version.workspace = true
description = "Async no_std driver for the Vishay VEML7700 ambient-light sensor with explicit fresh-measurement and threshold-monitor semantics"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ph-veml7700-als"
homepage = "https://github.com/photon-circus/ph-veml7700-als"
keywords = ["ambient-light", "veml7700", "embedded", "no-std", "i2c"]
categories = ["embedded", "no-std", "hardware-support"]
publish = false
exclude = ["tests/device_model.rs"]

[dependencies]
embedded-hal-async = { version = "1.0.0", default-features = false }
defmt = { version = "1.1.1", optional = true }

[features]
default = []
defmt = ["dep:defmt"]

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
ph-veml7700-als-model = { path = "../veml7700-model" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
