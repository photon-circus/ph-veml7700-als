[package]
name = "ph-veml7700-als"
version.workspace = true
description = "Async no_std driver for the Vishay VEML7700 ambient-light sensor with explicit fresh-measurement and threshold-monitor semantics"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ph-veml7700-als"
homepage = "https://github.com/photon-circus/ph-veml7700-als"
keywords = ["ambient-light", "veml7700", "embedded", "no-std", "i2c"]
categories = ["embedded", "no-std", "hardware-support"]
publish = false

[dependencies]
embedded-hal-async = { version = "1.0.0", default-features = false }
defmt = { version = "1.1.1", optional = true }
ph-curves = { version = "0.2.1", optional = true, default-features = false, features = ["gen-lib"] }

[features]
default = []
defmt = ["dep:defmt"]
# Exploration: host export against a future ph-curves gen-lib API. Does not
# compile on ph-curves 0.2.1. See exploration/ph-curves-transfer/README.md.
ph-curves = ["dep:ph-curves"]

[dev-dependencies]
# Retained: private scripted-transport tests still block_on. The model
# dev-dependency left with the conformance traces -- this package no longer
# builds the model at all.
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
