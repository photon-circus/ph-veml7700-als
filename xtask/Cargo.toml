[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.92.0"
description = "Repository automation for the canonical verification gate"

# Own workspace so this host tool is not a member of the product graph.
[workspace]


[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
regex = "1.11"
ron = "0.10"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
syn = { version = "2.0", features = ["full"] }
tar = "0.4"
toml = "0.8"
