[advisories]
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
confidence-threshold = 0.93
# Host-only. The product workspace deny.toml allows none of these additions.
#
# Unicode-3.0        clap/syn pull unicode-ident.
# ISC                ring, rustls-webpki, untrusted -- the TLS stack `ureq`
#                    needs to read the crates.io sparse index and archive.
# BSD-3-Clause       subtle, via ring.
# CDLA-Permissive-2.0  webpki-roots, the bundled trust store. It was MPL-2.0
#                    through 0.26.8 and has been CDLA-Permissive-2.0 since.
#
# Each entry was added from what `cargo deny check licenses` actually named,
# not from what the dependency tree was expected to carry.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "ISC",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
