[advisories]
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
confidence-threshold = 0.93
# Host-only: clap/syn pull unicode-ident, which carries Unicode-3.0.
# The product workspace deny.toml does not allow this license.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
